
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Metais | Claveon</title>

    <link rel="shortcut icon" href="../Imanges/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/categoria.css">
</head>

<body data-categoria="Metais">

    <nav class="navbar">
        <div class="menu">
            <a href="../index.html">Início</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="cadastro-instrumentos.html">Instrumentos</a>
            <a href="cadastro-produtos.html">Produtos</a>
            <a href="#" onclick="abrirContato(); return false;">Contato</a>
        </div>

        <div class="logo">
            <img src="../Imanges/claveon.png" alt="Logo Claveon"
                 onclick="abrirContato()">
        </div>
    </nav>

    <section class="titulo">
        <h1>Metais</h1>

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar instrumentos..."
            aria-label="Pesquisar instrumentos">
    </section>

    <main>
        <section class="produtos">
            <h2 class="titulo-lista">Instrumentos disponíveis</h2>

            <div id="listaInstrumentos" class="grade-catalogo">
                <p class="estado-catalogo">Carregando instrumentos...</p>
            </div>
        </section>

        <section id="secaoProdutos" class="produtos secao-produtos" hidden>
            <h2 id="tituloProdutos" class="titulo-lista">Produtos disponíveis</h2>

            <button type="button" id="voltarInstrumentos" class="btn-voltar">
                Voltar para instrumentos
            </button>

            <div id="listaProdutos" class="grade-catalogo">
            </div>
        </section>
    </main>

    <div id="modalContato" class="modal">
        <div class="modal-conteudo">
            <span class="fechar" onclick="fecharContato()">&times;</span>

            <h2>Claveon</h2>
            <p>E-mail: contato@claveon.com.br</p>
            <p>Telefone: (11) 99999-9999</p>
            <p>Endereço: São Paulo - SP</p>
            <p>Horário: Segunda a Sexta • 09:00 às 18:00</p>
        </div>
    </div>

    <script src="../js/script.js"></script>
    <script src="../js/instrumentos.js"></script>

</body>
</html>
