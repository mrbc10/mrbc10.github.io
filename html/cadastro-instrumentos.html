
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/instrumentos.css">
    <link rel="shortcut icon" href="../Imanges/favicon.ico" type="image/x-icon">

    <title>Cadastrar Instrumento | Claveon</title>
</head>

<body>

    <nav class="navbar">
        <div class="menu">
            <a href="../index.html">Início</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="cadastro-instrumentos.html">Instrumentos</a>
            <a href="cadastro-produtos.html">Produtos</a>
            <a href="#" onclick="abrirContato(); return false;">Contato</a>
        </div>

        <div class="logo">
            <img src="../Imanges/claveon.png" alt="Logo Claveon"
                 onclick="abrirContato()">
        </div>
    </nav>

    <div id="modalContato" class="modal">
        <div class="modal-conteudo">
            <span class="fechar" onclick="fecharContato()">&times;</span>
            <h2>Claveon</h2>
            <p>contato@claveon.com.br</p>
            <p>(11) 99999-9999</p>
            <p>São Paulo - SP</p>
            <p>Seg. à Sex. • 09:00 às 18:00</p>
        </div>
    </div>

    <main class="formulario-instrumento">
        <h1>Cadastrar instrumento</h1>
        <p class="subtitulo">Adicione um instrumento ao catálogo da Claveon.</p>

        <form id="formInstrumento">

            <label for="nomeInstrumento">Nome do instrumento</label>
            <input type="text" id="nomeInstrumento" name="nome"
                   placeholder="Ex.: Trompete" required>

            <label for="categoriaInstrumento">Categoria</label>
            <select id="categoriaInstrumento" name="categoria" required>
                <option value="">Selecione uma categoria</option>
                <option value="Metais">Metais</option>
                <option value="Cordas">Cordas</option>
                <option value="Madeiras">Madeiras</option>
                <option value="Percussão">Percussão</option>
                <option value="Teclas">Teclas</option>
                <option value="Outros">Outros</option>
            </select>

            <label for="descricaoInstrumento">Descrição</label>
            <textarea id="descricaoInstrumento" name="descricao"
                      placeholder="Descreva o instrumento"></textarea>

            <label for="imagemInstrumento">Caminho ou URL da imagem</label>
            <input type="text" id="imagemInstrumento" name="imagem"
                   placeholder="Ex.: ../Imanges/trompete.jpg">

            <button type="submit" class="btn-cadastro">
                Cadastrar instrumento
            </button>

            <p id="mensagemInstrumento" class="mensagem" role="status"></p>
        </form>

        <p class="link-formulario">
            Quer cadastrar produtos?
            <a href="cadastro-produtos.html">Ir para cadastro de produtos</a>
        </p>
    </main>

    <script src="../js/script.js"></script>
</body>

</html>
