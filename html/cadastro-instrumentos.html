
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/instrumentos.css">
    <link rel="shortcut icon" href="../Imanges/favicon.ico" type="image/x-icon">

    <title>Cadastrar Instrumento | Claveon</title>
</head>

<body>

    <!-- ===========================
         MENU DE NAVEGAÇÃO
    ============================ -->

    <nav class="navbar">

        <div class="menu">
            <a href="../index.html">Início</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="cadastro-instrumentos.html">Cadastrar instrumento</a>
            <a href="catalogo-instrumentos.html">Catálogo</a>
            <a href="#" onclick="abrirContato(); return false;">Contato</a>
        </div>

    </nav>


    <!-- ===========================
         MODAL DE CONTATO
    ============================ -->

    <div id="modalContato" class="modal">

        <div class="modal-conteudo">

            <span class="fechar" onclick="fecharContato()">&times;</span>

            <h2>Claveon</h2>

            <p>contato@claveon.com.br</p>
            <p>(11) 99999-9999</p>
            <p>São Paulo - SP</p>
            <p>Seg. à Sex. • 09:00 às 18:00</p>

        </div>

    </div>


    <!-- ===========================
         FORMULÁRIO DE INSTRUMENTOS
    ============================ -->

    <main class="formulario-instrumento">

        <h1>Cadastrar instrumento</h1>

        <p class="subtitulo">
            Adicione um instrumento ao catálogo da Claveon.
        </p>

        <form id="formInstrumento">

            <!-- E-mail do responsável -->

            <label for="emailUsuarioInstrumento">
                E-mail de quem está cadastrando
            </label>

            <input
                type="email"
                id="emailUsuarioInstrumento"
                name="emailUsuario"
                placeholder="Digite seu e-mail cadastrado"
                required
            >


            <!-- Nome do instrumento -->

            <label for="nomeInstrumento">
                Nome do instrumento
            </label>

            <input
                type="text"
                id="nomeInstrumento"
                name="nome"
                placeholder="Ex.: Trompete"
                required
            >


            <!-- Campo temporário para compatibilidade com o backend -->

            <input
                type="hidden"
                id="categoriaInstrumento"
                name="categoria"
                value="Não especificada"
            >


            <!-- Descrição -->

            <label for="descricaoInstrumento">
                Descrição
            </label>

            <textarea
                id="descricaoInstrumento"
                name="descricao"
                placeholder="Descreva o instrumento"
            ></textarea>


            <!-- Imagem -->

            <label for="imagemInstrumento">
                Caminho ou URL da imagem
            </label>

            <input
                type="text"
                id="imagemInstrumento"
                name="imagem"
                placeholder="Ex.: ../Imanges/trompete.jpg"
            >


            <!-- Botão -->

            <button type="submit" class="btn-cadastro">
                Cadastrar instrumento
            </button>

            <p
                id="mensagemInstrumento"
                class="mensagem"
                role="status"
                aria-live="polite">
            </p>

        </form>


        <!-- Link para o catálogo -->

        <p class="link-formulario">
            Quer conhecer os instrumentos cadastrados?

            <a href="catalogo-instrumentos.html">
                Acessar catálogo
            </a>
        </p>

    </main>


    <!-- JAVASCRIPT -->

    <script src="../js/script.js"></script>

</body>

</html>
