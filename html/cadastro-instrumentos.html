
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Instrumentos | Claveon</title>

    <link rel="shortcut icon" href="../Imanges/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/instrumentos.css">
</head>

<body>

    <nav class="navbar">
        <div class="menu">
            <a href="../index.html">Início</a>
            <a href="cadastro.html">Cadastro de usuários</a>
            <a href="cadastro-instrumentos.html">Cadastrar instrumentos</a>
            <a href="#" onclick="abrirContato()">Contato</a>
        </div>

        <div class="logo">
            <img src="../Imanges/claveon.png" alt="Logo Claveon"
                 onclick="abrirContato()">
        </div>
    </nav>

    <section class="cadastro">
        <h1>Cadastro de instrumentos</h1>

        <form id="formInstrumento">

            <label for="t">Nome do instrumento</label>
            <input
                type="text"
                id="t"
                name="t"
                placeholder="Ex.: Trompete"
                required>

            <label for="desc">Descrição</label>
            <textarea
                id="desc"
                name="desc"
                placeholder="Descreva o instrumento"
                rows="4"
                required></textarea>

            <label for="img">Caminho ou URL da imagem</label>
            <input
                type="text"
                id="img"
                name="img"
                placeholder="Ex.: ../Imanges/trompete.jpg"
                required>

            <label for="alt">Texto alternativo da imagem</label>
            <input
                type="text"
                id="alt"
                name="alt"
                placeholder="Ex.: Trompete dourado"
                required>

            <div id="mensagemInstrumento" class="mensagem"></div>

            <button type="submit" class="btn-cadastro">
                Cadastrar instrumento
            </button>

        </form>
    </section>

    <div id="modalContato" class="modal">
        <div class="modal-conteudo">
            <span class="fechar" onclick="fecharContato()">&times;</span>

            <h2>Claveon</h2>
            <p>contato@claveon.com.br</p>
            <p>(11) 99999-9999</p>
            <p>São Paulo - SP</p>
            <p>Seg. à Sex. • 09:00 às 18:00</p>
        </div>
    </div>

    <script src="../js/script.js"></script>

</body>
</html>
