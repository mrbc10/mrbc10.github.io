
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Claveon</title>

    <!-- Ícone e folhas de estilo -->
    <link rel="shortcut icon" href="../Imanges/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>

    <!-- ===========================
         MENU DE NAVEGAÇÃO
    ============================ -->

    <nav class="navbar">

        <div class="menu">
            <a href="../index.html">Início</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="cadastro-instrumentos.html">Cadastrar instrumento</a>
            <a href="catalogo-instrumentos.html">Catálogo</a>
            <a href="#" onclick="abrirContato(); return false;">Contato</a>
        </div>

    </nav>


    <!-- ===========================
         FORMULÁRIO DE CADASTRO
    ============================ -->

    <section class="cadastro">

        <h1>Crie sua conta</h1>

        <form id="formCadastro">

            <!-- Nome -->

            <label for="nome">Nome completo</label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome completo"
                required>


            <!-- E-mail -->

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required>


            <!-- Telefone -->

            <label for="telefone">Telefone</label>

            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
                required>


            <!-- Senha -->

            <label for="senha">Senha</label>

            <div class="campo-senha">

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required>

                <button
                    type="button"
                    class="btn-olho"
                    onclick="toggleSenha('senha', this)">
                    Ver
                </button>

            </div>


            <!-- Confirmar senha -->

            <label for="confirmarSenha">Confirmar senha</label>

            <div class="campo-senha">

                <input
                    type="password"
                    id="confirmarSenha"
                    name="confirmarSenha"
                    placeholder="Confirme sua senha"
                    required>

                <button
                    type="button"
                    class="btn-olho"
                    onclick="toggleSenha('confirmarSenha', this)">
                    Ver
                </button>

            </div>


            <!-- Mensagens de validação -->

            <div
                id="mensagem"
                class="mensagem"
                role="status"
                aria-live="polite">
            </div>


            <!-- Botão de cadastro -->

            <button type="submit" class="btn-cadastro">
                Criar conta
            </button>

        </form>


        <!-- Link para login -->

        <p class="login">

            Já possui uma conta?

            <a href="login.html">Entrar</a>

        </p>

    </section>


    <!-- ===========================
         MODAL DE CONTATO
    ============================ -->

    <div id="modalContato" class="modal">

        <div class="modal-conteudo">

            <span
                class="fechar"
                onclick="fecharContato()">
                &times;
            </span>

            <h2>Claveon</h2>

            <p>📧 contato@claveon.com.br</p>

            <p>📱 (11) 99999-9999</p>

            <p>📍 São Paulo - SP</p>

            <p>🕒 Seg. à Sex. • 09:00 às 18:00</p>

        </div>

    </div>


    <!-- ===========================
         JAVASCRIPT
    ============================ -->

    <script src="../js/script.js"></script>
    <script src="../js/cadastro.js" defer></script>

</body>

</html>
