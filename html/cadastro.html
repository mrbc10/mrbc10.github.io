<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Claveon</title>

    <link rel="shortcut icon" href="../Imanges/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="menu">
            <a href="../index.html">Início</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="#" onclick="abrirContato()">Contato</a>
        </div>

        <div class="logo">
            <img src="../Imanges/claveon.png" alt="Logo" onclick="abrirContato()">
        </div>

    </nav>

    <!-- Card de Cadastro -->
    <section class="cadastro">

        <h1>Crie sua conta</h1>

        <form id="formCadastro">

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome completo"
                required>

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required>

            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
                required>

            <label for="senha">Senha</label>

            <div class="campo-senha">

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required>

                <button
                    type="button"
                    class="btn-olho"
                    onclick="toggleSenha('senha', this)">
                    Ver
                </button>

            </div>

            <label for="confirmarSenha">Confirmar senha</label>

            <div class="campo-senha">

                <input
                    type="password"
                    id="confirmarSenha"
                    name="confirmarSenha"
                    placeholder="Confirme sua senha"
                    required>

                <button
                    type="button"
                    class="btn-olho"
                    onclick="toggleSenha('confirmarSenha', this)">
                    Ver
                </button>

            </div>

            <!-- Mensagens -->
            <div id="mensagem" class="mensagem"></div>

            <button type="submit" class="btn-cadastro">
                Criar conta
            </button>

        </form>

        <p class="login">
            Já possui uma conta?
            <a href="login.html">Entrar</a>
        </p>

    </section>

    <!-- Modal de Contato -->
    <div id="modalContato" class="modal">

        <div class="modal-conteudo">

            <span class="fechar" onclick="fecharContato()">&times;</span>

            <h2>Claveon</h2>

            <p>contato@claveon.com.br</p>

            <p>(11) 99999-9999</p>

            <p>São Paulo - SP</p>

            <p>Segunda à Sexta • 09:00 às 18:00</p>

        </div>

    </div>

    <script src="../js/cadastro.js"></script>

</body>

</html>
